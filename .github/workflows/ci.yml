name: GQL GPU Fabric CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: gpu/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r gpu/requirements.txt
      - name: Compile runtime and tests
        run: python -m compileall -q gpu/runtime tests
      - name: Run unit tests
        env:
          PYTHONPATH: gpu
        run: python -m unittest discover -s tests -v
