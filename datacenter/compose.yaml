services:
  gql-api:
    build:
      context: ..
      dockerfile: gpu/Dockerfile.cpu
    image: gql-gpu-fabric:cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MODEL_DIR: /models
      HF_HOME: /cache/huggingface
    volumes:
      - model-store:/models
      - model-cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  model-store:
  model-cache:
