"""GraphQL API contract for GQL GPU Fabric."""
scalar JSON

type Query {
  health: Health!
  hardware: Hardware!
  jobs: [Job!]!
}

type Mutation {
  registerJob(input: RegisterJobInput!): Job!
}

type Health {
  status: String!
  service: String!
  version: String!
}

type Hardware {
  platform: String!
  python: String!
  backend_hint: String!
  rocminfo_detected: Boolean!
  nvidia_smi: String
  model_dir: String!
  torch: TorchHardware!
}

type TorchHardware {
  available: Boolean!
  cuda_available: Boolean!
  device_count: Int!
  version: String
}

type Job {
  id: ID!
  kind: String!
  model: String!
  status: String!
  created_at: String!
  note: String!
  parameters: JSON!
  result: JSON
  error: String
}

input RegisterJobInput {
  kind: String!
  model: String!
  parameters: JSON
}
